name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal --component clippy,rustfmt
      - name: Select stable Rust
        run: rustup default stable
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Check documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --all-features --no-deps
      - name: Run tests
        run: cargo test --workspace --all-features
      - name: Check README examples
        run: cargo test --workspace --all-features --doc
      - name: Check supported feature combinations
        shell: bash
        run: |
          for package in tracing-layer-discord tracing-layer-slack; do
            cargo check -p "$package" --no-default-features
            cargo check -p "$package" --no-default-features --features rustls,gzip,log-errors
            cargo check -p "$package" --no-default-features --features native-tls,gzip,log-errors
          done
